[project]
name = "kurumsal-rag-asistani"
version = "0.1.0"
description = "Kurumsal dokümanlar için kaynak referanslı RAG asistanı (Gemini + ChromaDB + Streamlit)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
