# Streamlit Community Cloud demosunun uyku moduna geçmesini önler: birkaç saatte bir gerçek tarayıcıyla açar.
name: Demo uyanık tutma

on:
  schedule:
    - cron: "17 */6 * * *"   # 6 saatte bir (UTC)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
      - run: python scripts/keep_alive.py
        env:
          APP_URL: https://kurumsal-rag-pro.streamlit.app/
